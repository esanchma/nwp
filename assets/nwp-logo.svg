<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">nwp logo</title>
  <desc id="desc">A folded wiki page containing a geometric pi symbol and linked nodes.</desc>
  <defs>
